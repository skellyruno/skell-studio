name: Skell Studio workspace navigation - verify and commit
on:
  push:
    paths:
      - ".github/workflows/skell-navigation.yml"
      - "scripts/apply_skell_workspace_navigation.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skell-workspace-nav
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply protected toolbar refactor
        run: |
          python3 -m py_compile scripts/apply_skell_workspace_navigation.py
          python3 scripts/apply_skell_workspace_navigation.py
          python3 scripts/verify_source_merge.py
          git diff --check
      - name: Check theme and profile compatibility
        run: cargo test --locked -p os-theme -p os-paths
  commit-verified:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified navigation
        run: python3 scripts/apply_skell_workspace_navigation.py
      - name: Commit Skell toolbar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/os-app/src/views/toolbar.rs
          git diff --cached --check
          git commit -m "ui: introduce labeled Skell Studio workflow navigator"
          git push origin HEAD:main
