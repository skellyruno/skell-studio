<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemon Wave · Live Design</title><style>
:root{color-scheme:dark;font:14px system-ui;background:#10151b;color:#e8edf3}*{box-sizing:border-box}body{margin:0}header{height:76px;padding:16px 24px;display:flex;align-items:center;gap:28px;border-bottom:1px solid #33404c;background:#1d2730}h1{font-size:20px;margin:0}small{color:#a9bac5}nav{display:flex;gap:8px}button,select,input{font:inherit;color:inherit;background:#253541;border:1px solid #4a5b66;border-radius:6px;padding:8px}button{cursor:pointer}button.active{background:#515d37;color:#f3f3c3}main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:20px}article{min-width:0}#frame{width:100%;height:auto;display:block;border:1px solid #36434c;border-radius:9px;box-shadow:0 12px 36px #0006}aside{background:#1d2730;padding:16px;border-radius:9px}h2{font-size:14px;margin:22px 0 12px;color:#dfe6ad}h2:first-child{margin-top:0}label{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px}input[type=color]{padding:2px;width:55px;height:30px}input[type=range]{width:140px;padding:0}input[type=number]{width:70px}select{width:100%;margin-bottom:8px}#status{margin-left:auto;color:#b8d18e;font-size:12px}#error{color:#ffbdac;white-space:pre-wrap}p{line-height:1.55}#note{font-size:12px;color:#a9bac5}footer{padding:12px 0;font-size:12px;color:#a9bac5}#source{word-break:break-all;font-size:11px} @media(max-width:850px){main{grid-template-columns:1fr}header{height:auto;flex-wrap:wrap}}
</style></head><body><header><div><h1>LEMON WAVE <small>Live Design</small></h1><small>Real editor rendering · visual preview · no audio</small></div><nav><button data-page="0" class="active">Synth</button><button data-page="1">Modulation</button><button data-page="2">Table Edit</button></nav><span id="status">Starting preview…</span></header><main><article><img id="frame" alt="Live rendering of the Lemon Wave editor"><footer>Keep this page open while we work. Saved design edits refresh automatically. Use Lemon Wave Development with your LPK25 to hear the synth.</footer><p id="error" role="alert"></p></article></main><script>
const token='__TOKEN__', $=id=>document.getElementById(id);let revision=-1,busy=false;
function display(s){if(!s.app){$('error').textContent=s.error||'Preview unavailable';return}$('error').textContent=s.error||'';if(s.revision!==revision){revision=s.revision;$('frame').src='/frame.png?r='+revision;$('status').textContent='● Live';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',+b.dataset.page===s.page));}}
async function post(path,data){if(busy)return;busy=true;try{display(await(await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Wave-Token':token},body:JSON.stringify(data)})).json())}catch(e){$('error').textContent=e.message}finally{busy=false}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>post('/view',{page:+b.dataset.page}));
async function poll(){if(!busy)try{display(await(await fetch('/state')).json())}catch(e){$('status').textContent='Preview offline — reopen Live Preview';}setTimeout(poll,500)}poll();
</script></body></html>
