[package]
name = "lemon-wave"
description = "Lemon Wave: a polyphonic morphing wavetable instrument"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
linked = []
live-design = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-fx = { path = "../lemon-small-fx" }
os-plugkit = { path = "../../crates/os-plugkit" }
os-ui = { path = "../../crates/os-ui" }
os-theme = { path = "../../crates/os-theme" }
os-paths = { path = "../../crates/os-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[dev-dependencies]
tiny-skia = "0.11"
os-clap = { path = "../../crates/os-clap" }
os-vst3.workspace = true
os-host.workspace = true
os-engine.workspace = true
