name: Skell Studio — Windows VST3-only plugin bundles

on:
  push:
    branches: [main, dev/skell-verified-upgrade]
    paths:
      - ".github/workflows/skell-plugin-bundles.yml"
      - "crates/os-dsp/**"
      - "crates/os-engine/**"
      - "crates/os-host/**"
      - "crates/os-hostlink/**"
      - "crates/os-plugkit/**"
      - "crates/os-vst3/**"
      - "plugins/**"
      - "tools/bundle-plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main, feature/skell-fl-fst-presets-lynx-audit-20261120, feature/skell-lynx-reeverb2-in-place-20261121]
    paths:
      - ".github/workflows/skell-plugin-bundles.yml"
      - "crates/os-dsp/**"
      - "crates/os-engine/**"
      - "crates/os-host/**"
      - "crates/os-hostlink/**"
      - "crates/os-plugkit/**"
      - "plugins/**"
      - "tools/bundle-plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skell-plugin-bundles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-plugin-suite:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SKELL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout is the exact release-candidate revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SKELL_SOURCE_SHA) {
            throw "Incorrect checked-out source: expected=$env:SKELL_SOURCE_SHA actual=$actual"
          }
          Write-Host "Verified source commit: $actual"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run core dynamics, delay, reverb and EQ plugin tests
        shell: pwsh
        run: |
          $shotDir = Join-Path $env:GITHUB_WORKSPACE "target/skell-plugin-shots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          $env:OS_SHOT_DIR = $shotDir
          $env:SKELL_DSP_METRICS_PATH = Join-Path $shotDir "BEAT_DSP_METRICS.txt"
          cargo test --locked -p lemon-limiter -p lemon-delay -p lemon-reverb -p lemon-hall -p lemon-parametric-eq-2 -p press -p gross-beat -p fruity-compressor -p lynx-tune

      - name: Upload native Skell plugin editor captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkellStudio-Native-Plugin-Editor-Captures
          path: |
            target/skell-plugin-shots/*.png
            target/skell-plugin-shots/BEAT_DSP_METRICS.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build the complete Windows VST3 plugin suite
        shell: pwsh
        run: cargo run --locked --release -p bundle-plugins

      - name: Round-trip Skell VST3 state through the Studio host
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo test --locked -p os-vst3 hosts_skell_plugins_and_roundtrips_component_state_through_host_wrapper -- --nocapture

      - name: Validate all 33 Windows VST3 plugins in external pluginval host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:GITHUB_WORKSPACE "target/pluginval-v1.0.4"
          $reports = Join-Path $env:GITHUB_WORKSPACE "target/pluginval-reports"
          New-Item -ItemType Directory -Force -Path $dir, $reports | Out-Null
          $zip = Join-Path $dir "pluginval_Windows.zip"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $zip
          (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content (Join-Path $reports "tool-archive.sha256")
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $validator = Get-ChildItem -Path $dir -File -Recurse -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $validator) { throw "pluginval v1.0.4 Windows executable missing from official archive" }
          $bundled = @(Get-ChildItem -LiteralPath "target/bundled" -Directory -Filter "*.vst3" | Sort-Object Name)
          if ($bundled.Count -ne 33) { throw "Expected 33 VST3 bundles, found $($bundled.Count)" }
          $failures = [System.Collections.Generic.List[string]]::new()
          $summary = @("plugin,status,strictness,tool_version")
          foreach ($bundle in $bundled) {
            $name = [IO.Path]::GetFileNameWithoutExtension($bundle.Name)
            $module = $bundle.FullName
            $base = $name -replace '[^A-Za-z0-9_-]', '-'
            $log = Join-Path $reports "$base.out.txt"
            $err = Join-Path $reports "$base.err.txt"
            $arguments = "--strictness-level 5 --skip-gui-tests --validate `"$module`""
            Write-Host "pluginval v1.0.4 strictness 5: $name"
            $proc = $null
            $status = "PASS"
            try {
              $proc = Start-Process -FilePath $validator.FullName -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err
              if (-not $proc.WaitForExit(180000)) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                $status = "TIMEOUT"
              } elseif ($proc.ExitCode -ne 0) {
                $status = "FAIL:$($proc.ExitCode)"
              }
            } catch {
              $status = "ERROR"
              "$_" | Add-Content -LiteralPath $err
            } finally {
              if ($null -ne $proc) { $proc.Dispose() }
            }
            $summary += "$name,$status,5,1.0.4"
            if ($status -eq "PASS") {
              Write-Host "pluginval passed: $name"
            } else {
              $failures.Add("$name=$status")
              Write-Warning "pluginval failed: $name ($status)"
            }
          }
          $summary | Set-Content -LiteralPath (Join-Path $reports "PLUGINVAL_ALL_33_SUMMARY.csv") -Encoding utf8
          if ($failures.Count -gt 0) {
            throw "External VST3 validation failures ($($failures.Count)/33): $($failures -join ', ')"
          }
      - name: Upload external VST3 validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkellStudio-External-VST3-Validator-Reports
          path: target/pluginval-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stress priority VST3s at 44.1/48/96 kHz through Studio host
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo test --locked -p os-vst3 priority_vst3_plugins_process_and_restore_at_three_sample_rates -- --nocapture

      - name: Validate 33 VST3 bundles and AMD64 modules
        shell: pwsh
        run: |
          $names = @("ML Limiter", "ML Delay", "ML Reverb", "ML Hall", "ML EQ", "ML Press", "Skell Beat", "Skell Compressor", "Skell Tune")
          $allVst3 = @(Get-ChildItem -Path "target/bundled" -Directory -Filter "*.vst3")
          if ($allVst3.Count -ne 33) { throw "Expected 33 VST3 bundles, found $($allVst3.Count)" }
          $staleClap = @(Get-ChildItem -Path "target/bundled" -Filter "*.clap")
          if ($staleClap.Count -ne 0) { throw "CLAP found in VST3-only release output" }
          foreach ($name in $names) {
            $vst3 = Join-Path "target/bundled" "$name.vst3/Contents/x86_64-win/$name.vst3"
            foreach ($module in @($vst3)) {
              if (-not (Test-Path -LiteralPath $module -PathType Leaf)) {
                throw "Missing plugin module: $module"
              }
              $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $module))
              if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw "Invalid PE/DOS header: $module"
              }
              $pe = [BitConverter]::ToInt32($bytes, 0x3c)
              if ($pe -lt 0 -or ($pe + 6) -gt $bytes.Length -or
                  $bytes[$pe] -ne 0x50 -or $bytes[$pe + 1] -ne 0x45 -or
                  $bytes[$pe + 2] -ne 0 -or $bytes[$pe + 3] -ne 0) {
                throw "Invalid PE signature: $module"
              }
              $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
              if ($machine -ne 0x8664) {
                throw "Expected AMD64 (0x8664), got 0x$($machine.ToString('x4')): $module"
              }
              Write-Host "AMD64 OK: $module ($($bytes.Length) bytes)"
            }
          }

      - name: Write exact-commit VST3 module checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath "target/bundled").Path
          $modules = @(Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { $_.Extension -eq ".vst3" } |
            Sort-Object FullName)
          $clap = @(Get-ChildItem -LiteralPath $root -Recurse |
            Where-Object { $_.Extension -eq ".clap" })
          if ($modules.Count -ne 33 -or $clap.Count -ne 0) {
            throw "Expected 33 VST3 and zero CLAP modules, found VST3=$($modules.Count), CLAP=$($clap.Count)"
          }
          foreach ($needed in @(
            "LICENSE-GPL-3.0-or-later.txt",
            "THIRD-PARTY-NOTICES.txt",
            "CREDITS_AND_LICENSES.md",
            "SKELL-BEAT-LYNX-UI-NOTICE.md",
            "SOURCE_AND_LICENSE_README.txt",
            "licenses/Skell-Beat-AGPL-3.0.txt",
            "licenses/Skell-Compressor-AGPL-3.0.txt",
            "licenses/ML-Limiter-AGPL-3.0.txt",
            "licenses/ML-Delay-AGPL-3.0.txt",
            "licenses/ML-Reverb-AGPL-3.0.txt"
          )) {
            $file = Join-Path $root $needed
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required release license or source notice missing: $needed" }
            if ((Get-Item -LiteralPath $file).Length -lt 80) { throw "Suspiciously small license or source notice: $needed" }
          }
          $readme = Get-Content -LiteralPath (Join-Path $root "SOURCE_AND_LICENSE_README.txt") -Raw
          if (-not $readme.Contains($env:SKELL_SOURCE_SHA)) { throw "Source notice does not match checkout revision" }
          $manifest = @(
            "Skell Studio Windows VST3-only plugin bundle"
            "Commit: $env:SKELL_SOURCE_SHA"
            "CI workflow ref SHA: $env:GITHUB_SHA"
            "Target: Windows x64 / AMD64"
            "VST3 modules: $($modules.Count)"
            "CLAP modules: 0 (not distributed)"
            "SHA-256 checksums:"
          )
          foreach ($module in $modules) {
            $relative = [System.IO.Path]::GetRelativePath($root, $module.FullName)
            $hash = (Get-FileHash -LiteralPath $module.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += "$hash  $relative"
          }
          $manifest | Set-Content -LiteralPath (Join-Path $root "BUILD_MANIFEST.txt") -Encoding utf8
          Write-Host "Manifest generated: $($modules.Count) VST3 modules from $env:SKELL_SOURCE_SHA"

      - name: Upload Windows VST3 plugin suite
        uses: actions/upload-artifact@v4
        with:
          name: SkellStudio-Windows-x64-VST3-Plugin-Suite
          path: target/bundled/
          if-no-files-found: error
          retention-days: 7
