[workspace]
resolver = "2"
members = ["plugins/ml-plasma", "crates/os-collab", "plugins/lemon-hall", "plugins/lemon-tape", "plugins/lemon-wave", "crates/os-model", "crates/os-flp", "crates/os-engine", "crates/os-dsp", "tools/flp-dump", "tools/os-render", "tools/os-play", "tools/bundle-app", "crates/os-native", "tools/os-native-probe", "crates/os-theme", "crates/os-ui", "crates/os-app", "plugins/lemon-sampler", "plugins/lemon-chop", "tools/bundle-plugins", "crates/os-clap", "crates/os-hostlink", "crates/os-plugkit", "plugins/lemon-parametric-eq-2", "crates/os-host", "crates/os-vst3", "crates/os-vst2", "plugins/lemon-3x-osc", "plugins/lemon-limiter", "plugins/lemon-reverb", "plugins/lemon-delay", "plugins/lemon-small-fx", "plugins/lemon-soft-clipper", "plugins/lemon-fast-distortion", "plugins/lemon-balance", "plugins/lemon-stereo-enhancer", "plugins/lemon-transient-processor", "plugins/lemon-chorus", "plugins/lemon-stereo-shaper", "plugins/lemon-filter", "plugins/citrus", "plugins/smith", "plugins/tesla", "plugins/pulp-filter", "plugins/press", "crates/os-paths", "tools/watermark", "crates/os-smf", "tools/notices", "tools/updater", "plugins/lemon-flanger", "plugins/lemon-phaser", "plugins/lemon-peak-controller", "plugins/lemon-formula-controller", "plugins/lemon-slicer", "plugins/lemon-vocoder", "plugins/lemon-drum-sampler", "plugins/lemon-drop"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
os-model = { path = "crates/os-model" }
os-flp = { path = "crates/os-flp" }
os-engine = { path = "crates/os-engine" }
os-dsp = { path = "crates/os-dsp" }
os-hostlink = { path = "crates/os-hostlink" }
os-host = { path = "crates/os-host" }
os-vst3 = { path = "crates/os-vst3" }
os-vst2 = { path = "crates/os-vst2" }
os-paths = { path = "crates/os-paths" }
os-smf = { path = "crates/os-smf" }
thiserror = "2"

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
mp3lame-sys = { path = "vendor/mp3lame-sys" }

# Fast engineering/UI previews. Do not use for sound-quality or release benchmarks.
# The inherited dev profile and its dependencies are optimized at level 3.
# This explicit opt=0 profile keeps first-time Windows screenshot builds shorter.
[profile.skell-preview]
inherits = "dev"
opt-level = 0
debug = 0
incremental = true

[profile.skell-preview.package."*"]
opt-level = 0
