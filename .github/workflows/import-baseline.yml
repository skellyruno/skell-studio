name: Import uploaded Skell Studio source baseline
on:
  push:
    paths:
      - .github/workflows/import-baseline.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skell-studio-baseline-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Skell Studio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned public archive revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skell-pinned"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://codeload.github.com/ajdohaxhia/ADE-Studio/zip/ca8e151e4ea8c3f431ef0d7f7fb27df92a2c6df1" \
            --output "$RUNNER_TEMP/skell-pinned/ADE.zip"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://codeload.github.com/Dorfhaus/ML-Studio/zip/0e9cc0919468f89d1655ccfd19eaaabf08ee7980" \
            --output "$RUNNER_TEMP/skell-pinned/ML.zip"
          ls -lh "$RUNNER_TEMP/skell-pinned"
      - name: Verify all source file hashes and import combined baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_pinned_upstream.py \
            "$RUNNER_TEMP/skell-pinned/ADE.zip" \
            "$RUNNER_TEMP/skell-pinned/ML.zip" .
          python3 scripts/verify_source_merge.py
      - name: Commit verified source to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A
          if git diff --cached --quiet; then
            echo "No changes to upload."
            exit 0
          fi
          git diff --cached --stat | tail -20
          git commit -m "feat: import verified ADE + ML Skell Studio source baseline"
          git push origin HEAD:main
