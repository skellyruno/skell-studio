name: Skell Studio UI v2 - validate and apply
on:
  push:
    paths:
      - ".github/workflows/skellification-v2.yml"
      - "scripts/apply_skell_ui_v2.py"
      - "scripts/apply_skell_asset_links.py"
      - "tools/branding/generate_skell_icons.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skell-ui-v2-apply
  cancel-in-progress: true
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply proposed source/UI refactor and generate original icon
        run: |
          python3 -m py_compile scripts/apply_skell_ui_v2.py scripts/apply_skell_asset_links.py tools/branding/generate_skell_icons.py
          python3 scripts/apply_skell_ui_v2.py
          python3 tools/branding/generate_skell_icons.py
          python3 scripts/apply_skell_asset_links.py
          python3 scripts/verify_source_merge.py
      - name: Verify Rust unit tests for design and isolated profiles
        run: cargo test --locked -p os-theme -p os-paths

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply identical UI + resource changes to Windows checkout
        shell: pwsh
        run: |
          python -m py_compile scripts/apply_skell_ui_v2.py scripts/apply_skell_asset_links.py tools/branding/generate_skell_icons.py
          python scripts/apply_skell_ui_v2.py
          python tools/branding/generate_skell_icons.py
          python scripts/apply_skell_asset_links.py
      - name: Compile Windows DAW source with embedded original icon
        shell: pwsh
        env:
          OPENSTUDIO_NO_PLUGIN_BUILD: "1"
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo check --locked -p os-app --bin skell-studio

  commit-linux-tested:
    needs: [linux-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reproduce exactly the checked source
        run: |
          python3 scripts/apply_skell_ui_v2.py
          python3 tools/branding/generate_skell_icons.py
          python3 scripts/apply_skell_asset_links.py
      - name: Commit Skell Studio v2 source after source checks and theme tests
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/os-theme/src/design.rs crates/os-app/src/views/playlist.rs \
            crates/os-app/src/views/piano.rs crates/os-app/src/views/mixer.rs \
            crates/os-app/build.rs crates/os-app/src/linux_launcher.rs \
            crates/os-app/assets/skell-studio.desktop \
            crates/os-app/assets/skell-studio.png crates/os-app/assets/skell-studio.ico \
            crates/os-app/assets/skell-studio-nightly.ico
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: skellify playlist, piano roll, mixer and original application icons"
          git push origin HEAD:main
