name: Skell Studio — branding and engine compile gates
on:
  push:
    branches: [main, dev/skell-verified-upgrade]
    paths:
      - "plugins/**"
      - ".github/workflows/skell-studio-verify.yml"
      - "crates/os-app/**"
      - "crates/os-flp/**"
      - "crates/os-dsp/**"
      - "crates/os-theme/**"
      - "crates/os-paths/**"
      - "plugins/smith/**"
      - "plugins/lemon-reverb/**"
      - "plugins/lemon-delay/**"
      - "plugins/lemon-chop/**"
      - "crates/os-hostlink/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main, feature/skell-fl-fst-presets-lynx-audit-20261120, feature/skell-lynx-reeverb2-in-place-20261121]
    paths:
      - "plugins/**"
      - ".github/workflows/skell-studio-verify.yml"
      - "crates/os-app/**"
      - "crates/os-flp/**"
      - "crates/os-theme/**"
      - "crates/os-paths/**"
      - "plugins/smith/**"
      - "plugins/lemon-chop/**"
      - "crates/os-hostlink/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skell-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run theme and settings-path unit tests
        run: cargo test --locked -p os-theme -p os-paths
      - name: Test opt-in RT audit instrumentation
        run: cargo test --locked -p os-dsp --features rt-audit
      - name: Check merge safety invariants
        run: python3 scripts/verify_source_merge.py
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Skell Studio Windows code compiles
        shell: pwsh
        env:
          OPENSTUDIO_NO_PLUGIN_BUILD: "1"
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          cargo check --locked -p os-app --bin skell-studio
          cargo check --locked -p os-app --bin skell-studio --features rt-audit
      - name: Run FL FST preset import regression
        shell: pwsh
        env:
          OPENSTUDIO_NO_PLUGIN_BUILD: "1"
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo test --locked -p os-app --bin skell-studio fl_fst_presets
