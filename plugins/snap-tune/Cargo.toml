[package]
name = "snap-tune"
description = "SnapTune pitch correction plug-in for Skell Studio"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[features]
# Kept as a separate plug-in module: SnapTune's AGPL DSP is not linked into the GPL Studio executable.
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-fx = { path = "../lemon-small-fx" }
os-dsp.workspace = true
