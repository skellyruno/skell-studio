[package]
name = "lynx-tune"
description = "Skell Tune real-time vocal pitch correction using the pinned LYNX YIN / TD-PSOLA engine"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[features]
default = []
linked = []

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-fx = { path = "../lemon-small-fx" }

[build-dependencies]
cc = "1"
