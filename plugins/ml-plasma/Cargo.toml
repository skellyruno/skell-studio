[package]
name = "ml-plasma"
description = "AQUILA's bundled Gridline Plasma adaptation"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
os-paths.workspace = true
os-clap = { path = "../../crates/os-clap" }
os-host.workspace = true
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
os-engine.workspace = true
