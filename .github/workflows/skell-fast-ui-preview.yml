name: Skell Studio fast Windows preview + real UI captures
on:
  push:
    branches: [dev/skell-fast-ui-preview, fix/quickview-exit-status-four-scenes-20261115]
    paths:
      - ".github/workflows/skell-fast-ui-preview.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "plugins/lemon-reverb/**"
      - "scripts/ci_capture_skell_ui.ps1"
      - "crates/os-app/src/starter_pack.rs"
      - "crates/os-app/src/main.rs"
      - "crates/os-app/src/views/plugin_palette.rs"
      - "crates/os-app/src/views/playlist.rs"
      - "crates/os-app/src/motion.rs"
      - "crates/os-app/src/anim.rs"
  pull_request:
    branches: [main, feature/skell-fl-fst-presets-lynx-audit-20261120]
    paths:
      - ".github/workflows/skell-fast-ui-preview.yml"
      - "Cargo.toml"
      - "scripts/ci_capture_skell_ui.ps1"
      - "scripts/skell-quickview.ps1"
      - "Skell-QuickView.cmd"
      - "crates/os-app/src/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('skell-fast-preview-manual-{0}', github.run_id) || format('skell-fast-preview-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OPENSTUDIO_NO_PLUGIN_BUILD: "1"
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skell-ui-preview-windows
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Validate local QuickView PowerShell and dry-run plans
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/skell-quickview.ps1).Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "QuickView script has $($errors.Count) parser errors."
          }
          ./scripts/skell-quickview.ps1 -Mode Render -View all -Size 1440x900 -Plan
          ./scripts/skell-quickview.ps1 -Mode BuildRender -View mixer -Size 1280x720 -Jobs 2 -Plan
          if (Test-Path .skell-quickview) { throw "Dry-run must not touch local settings or captures" }
      - name: Compile fast UI preview executable (not release)
        shell: pwsh
        run: cargo build --locked --profile skell-preview -p os-app --bin skell-studio
      - name: Run playlist track-label fit regression
        shell: pwsh
        run: cargo test --locked -p os-app --bin skell-studio track_label_font_tests -- --nocapture
      - name: Check Windows executable header
        shell: pwsh
        run: |
          $exe = "target/skell-preview/skell-studio.exe"
          if (-not (Test-Path $exe)) { throw "Skell Studio executable not found" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw "Skell Studio Windows executable header/size invalid"
          }
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Set-Content "target/skell-preview/skell-studio.exe.sha256"
      - name: Capture real Skell renderer screenshots at 3 window sizes
        shell: pwsh
        run: ./scripts/ci_capture_skell_ui.ps1
      - name: Stamp native capture source revision
        shell: pwsh
        env:
          SKELL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SKELL_SOURCE_SHA) { throw "Wrong UI capture source revision" }
          "Commit: $actual" | Add-Content captures/CAPTURE_MANIFEST.txt
      - name: Upload executable and native UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SkellStudio-Windows-Fast-Preview-With-UI
          path: |
            target/skell-preview/skell-studio.exe
            target/skell-preview/skell-studio.exe.sha256
            captures/*.png
            captures/CAPTURE_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
      - name: Report compiler cache efficiency
        if: always()
        shell: pwsh
        run: sccache --show-stats
