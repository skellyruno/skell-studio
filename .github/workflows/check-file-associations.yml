name: Validate Skell Windows file associations
on:
  push:
    branches: [dev/skell-windows-association-isolation]
    paths:
      - ".github/workflows/check-file-associations.yml"
      - "crates/os-app/src/file_assoc.rs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-association-tests:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Windows file association tests with isolated registry fixtures
        shell: pwsh
        env:
          OPENSTUDIO_NO_PLUGIN_BUILD: "1"
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo test --locked -p os-app --bin skell-studio file_assoc::tests -- --test-threads=1
