# ML Studio public website. The existing product directory serves signed updates.
RewriteCond %{THE_REQUEST} "\s/+lemon-studio(?:/index\.html|/)?(?:[?\s])"
RewriteRule ^lemon-studio(?:/index\.html|/)?$ /ml-studio/ [R=301,L]
RewriteRule ^ml-studio(?:/index\.html)?$ /ml-studio/ [R=301,L]
RewriteRule ^ml-studio/$ lemon-studio/index.html [L]
RewriteRule ^ml-studio/((?:downloads|linux|mac|updates|platforms)/.+)$ lemon-studio/$1 [L]
