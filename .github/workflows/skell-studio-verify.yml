name: Skell Studio — branding and engine compile gates
on:
  push:
    branches: [main, dev/skell-fast-windows-cache]
    paths:
      - ".github/workflows/skell-studio-verify.yml"
      - "crates/os-app/**"
      - "crates/os-theme/**"
      - "crates/os-paths/**"
      - "plugins/smith/**"
      - "plugins/lemon-chop/**"
      - "plugins/lemon-slicer/**"
      - "plugins/lemon-drop/**"
      - "crates/os-hostlink/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skell-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run theme and settings-path unit tests
        run: cargo test --locked -p os-theme -p os-paths
      - name: Check merge safety invariants
        run: python3 scripts/verify_source_merge.py
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Cache Rust compiler outputs across ephemeral GitHub runners.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      OPENSTUDIO_NO_PLUGIN_BUILD: "1"
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust dependencies (including failed-check builds)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: skell-windows-check
          cache-on-failure: true
          # Initial branch run may create the cache; normal verification runs
          # subsequently reuse it. Other branches only restore caches.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/skell-fast-windows-cache' }}
      - name: Enable shared compiler-output cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Verify Skell Studio Windows code compiles
        shell: pwsh
        run: cargo check --locked -p os-app --bin skell-studio
      - name: Show cache hits and misses
        if: always()
        shell: pwsh
        run: sccache --show-stats
